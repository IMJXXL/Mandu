org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:HeapBaseMinAddress=32g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

kotlin.daemon.jvmargs=-Xmx1280m -XX:+UseSerialGC
# ★ 1.001 让 Gradle 9.5.1 daemon 找到本机 JDK 21（gradle-daemon-jvm.properties 写死 toolchainVersion=21，本机无 21 会卡自动下载）
org.gradle.java.installations.paths=X:/115/jdk-21_windows-x64_bin/jdk-21.0.11,X:/115/OpenJDK17U-jdk_x64_windows_hotspot_17.0.19_10/jdk-17.0.19+10
org.gradle.java.installations.auto-download=false

# 内存紧张：Kotlin 编译并入 Gradle 守护进程，不另起 1.5G 的 Kotlin 守护进程
kotlin.compiler.execution.strategy=in-process
